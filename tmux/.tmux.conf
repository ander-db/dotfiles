# Set terminal overrides
set-option -sa terminal-overrides ',XXX:RGB'
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse support
set -g mouse on

# Set vi mode
set-window-option -g mode-keys vi

# Enhanced vi mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Dracula configuration
set -g @dracula-plugins "git time"
set -g @dracula-military-time true
set -g @dracula-show-left-icon session

# Highlight active window
set-window-option -g window-status-current-style bg=red,fg=white,bright

# Customize window status format
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format ' #I:#W '

# Set status bar colors
set -g status-style bg=black,fg=white

# Highlight active pane border
set-option -g pane-active-border-style fg=blue
set-option -g pane-border-style fg=colour240

# Remove background highlight for active/inactive panes
set-window-option -g window-active-style bg=default
set-window-option -g window-style bg=default

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
